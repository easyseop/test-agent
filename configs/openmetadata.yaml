# OpenMetadata 1.13.2 (BANK 확장본) 검증 설정
#
# 대상 팀이 회신한 접속·로그인·기대동작 정보를 그대로 옮긴 초안이다.
# `TODO(회신필요)` 표시가 붙은 값은 아직 못 받은 것이라, 그 줄을 채우기 전에는
# 해당 시나리오가 돌지 않는다. 무엇이 왜 필요한지는 각 줄에 적어 두었다.
#
# 기대값의 근거는 회신받은 "이래야 한다" 문장이며, OpenMetadata 구현 코드의
# 조건문을 베끼지 않는다. 코드는 셀렉터 확인 용도로만 본다.

target:
  base_url: http://127.0.0.1:8585
  # SPA(React)라 클릭 직후 DOM이 늦게 붙는다. 데모앱(400ms)보다 넉넉히 준다.
  settle_ms: 900
  nav_timeout_ms: 20000
  scenario_timeout_ms: 90000
  app_version: OpenMetadata 1.13.2 (rev 9587fe8f / 1.13.1 데이터 마이그레이션본)
  # 로그인 전 호출되는 인증 API가 401을 내는 것은 정상 동작이므로 실패로 세지 않는다.
  ignore_http_error_patterns:
    - "/api/v1/users/loggedInUser"

# 버튼 일괄 클릭은 끈다.
#
# 대상이 운영 데이터를 마이그레이션해 온 관리자 콘솔이기 때문이다. 삭제·회수
# 계열 버튼은 내장 차단 목록이 막지만, 그 목록은 최소 안전망이지 이 앱의 위험
# 버튼(Hard Delete, 서비스 삭제, 토큰 Revoke, Deactivate)을 전부 알지 못한다.
# 모르는 화면을 무작위로 눌러 보는 방식은 이 대상에 맞지 않는다.
button_sweep:
  enabled: false

crawl:
  # run에서는 끈다 — 검증할 화면을 명시적으로 지정한 것만 돈다.
  enabled: false
  # 아래 값은 `discover` 명령에만 적용된다. discover는 enabled와 무관하게
  # 순회하며, 링크를 따라가기만 하고 버튼을 누르지 않는다(GET 이동뿐).
  # 화면 B의 경로를 찾는 것이 이 순회의 목적이라 기본값(8쪽)보다 넓게 잡았다.
  max_pages: 25
  max_depth: 3
  exclude_patterns:
    # 세션이 끊기면 순회가 거기서 끝난다.
    - "/logout"
    - "/signout"
    - "/signin"

auth:
  steps:
    - {action: goto, value: /signin}
    - {action: wait_for, selector: '[data-testid="login-form-container"]'}
    - {action: fill, selector: '[data-testid="email"]', value: "admin@open-metadata.org"}
    - {action: fill, selector: '[data-testid="password"]', value: "${OM_ADMIN_PASSWORD}"}
    - {action: click, selector: '[data-testid="login"]'}
    - {action: wait_ms, value: "3000"}
    # 로그인 폼이 사라진 것으로 성공을 판정한다.
    #
    # "로그인 후에만 보이는 요소"를 아직 못 받았기 때문에 고른 방식이다. 모르는
    # 셀렉터를 찍어 넣으면 로그인이 성공해도 단언이 깨져 discover가 그대로
    # 멈춘다 — 아무것도 못 알아내고 끝난다. 반대로 로그인이 실패하면 폼이 남아
    # 있으므로 이 단언은 정확히 실패한다. 약하지만 틀리지는 않는다.
    #
    # TODO(회신필요): discover 결과에서 로그인 후에만 보이는 data-testid를 골라
    #   아래 두 줄을 양성 단언(wait_for + assert_visible)으로 교체할 것.
    #   그래야 "빈 화면이 떴는데 통과"를 막을 수 있다.
    - {action: assert_not_visible, selector: '[data-testid="login-form-container"]'}

data_checks:
  # 화면 A — 테이블 상세의 스키마(컬럼) 표에 BANK 확장 속성 3종이 뜨는가.
  # 정답원은 REST API. 화면이 백엔드 응답을 그대로 표시하는지(표시 계층)를 본다.
  - name: BANK확장컬럼-화면과API일치
    description: >
      스키마 표의 각 컬럼 행은 확장 속성 3종(attributeName·instanceName·infoType)을
      표시하고, 그 값이 API의 column.extension과 행 단위로 일치해야 한다
    # TODO(회신필요): 검증 대상 테이블의 FQN.
    #   예시 형태 — sample_data.ecommerce_db.shopify.raw_product_catalog
    page: '/table/TODO_TABLE_FQN'
    steps:
      - {action: wait_for, selector: '[data-testid="entity-table"]'}
    ui_table:
      selector: '[data-testid="entity-table"]'
      # TODO(회신필요): 표의 실제 헤더 텍스트.
      #   확장 속성 3종이 별도 열로 뜨는지, 아니면 한 칸 안에 묶여 뜨는지에 따라
      #   여기가 달라진다. 한 칸에 묶여 있으면 열 단위 대조가 불가능해
      #   spec_checks(단언 방식)로 바꿔야 한다.
      columns: [TODO_컬럼명헤더, TODO_attributeName헤더, TODO_instanceName헤더, TODO_infoType헤더]
    query:
      api:
        url: '/api/v1/tables/name/TODO_TABLE_FQN?fields=columns'
        rows_path: columns
        columns: [name, extension.attributeName, extension.instanceName, extension.infoType]
        headers:
          # query.api는 브라우저가 아니라 별도 HTTP 요청으로 나간다. 로그인
          # 세션이 붙지 않으므로 토큰을 직접 줘야 한다. 값이 아니라 환경변수로만.
          Authorization: "Bearer ${OM_JWT}"

  # 화면 B — 실패한 assertion 목록.
  # TODO(회신필요): 이 화면의 실제 경로. "라우트 UI에서 확인 필요"로 회신돼
  #   아직 열 수가 없다. 경로가 없으면 이 시나리오는 시작조차 못 한다.
  - name: 실패assertion-상태와소유자
    description: >
      실패한 assertion 행은 상태 Failed와 소유자를 함께 표시하고,
      대상이 table+column 단위로 정확히 매칭되어야 한다
    page: '/TODO_DATA_ASSERTIONS_경로'
    steps:
      - {action: wait_for, selector: 'table'}
    ui_table:
      # TODO(회신필요): 표 셀렉터. role=row만으로는 어느 표인지 특정되지 않는다.
      selector: 'TODO_ASSERTION_표_셀렉터'
      columns: [TODO_대상헤더, TODO_상태헤더, TODO_소유자헤더]
    query:
      api:
        # 회신받은 API는 단건 조회(name/<FQN>)라 목록 대조에 쓸 수 없다.
        # TODO(회신필요): 목록을 주는 조회 경로와 필터 조건.
        url: '/api/v1/dataQuality/testCases?fields=owners,testCaseResult&limit=100'
        rows_path: data
        columns: [entityLink, testCaseResult.testCaseStatus, 'owners.0.displayName']
        headers:
          Authorization: "Bearer ${OM_JWT}"

# 화면 C — 한글 IME 조합 입력은 지금 엔진으로 검증할 수 없다.
#
# fill()은 값을 직접 꽂고, press()는 키 한 번을 누른다. 둘 다
# compositionstart~compositionend 이벤트를 만들지 않는다. 즉 "조합 중에 글자가
# 유실되는가"라는 질문 자체를 재현할 수단이 없다.
#
# 여기서 억지로 fill()을 써서 "통과"를 만들면 검증하지 않은 것을 검증했다고
# 말하는 셈이라, 시나리오를 넣지 않고 비워 둔다. 필요한 기능은 별도 개발 항목이다.

report:
  title: OpenMetadata 1.13.2 (BANK 확장) 자동 검증
  video: true
  trace: true

output_dir: runs
