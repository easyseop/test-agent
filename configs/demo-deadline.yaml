# 전체 실행 제한 시간 초과가 부분 성공이 아니라 실행 불가로 기록되는지 확인
target:
  base_url: http://127.0.0.1:5057
  settle_ms: 100
  nav_timeout_ms: 10000
  scenario_timeout_ms: 10000
  run_timeout_ms: 4000
  app_version: demo-deadline

crawl:
  enabled: false

button_sweep:
  enabled: false

spec_checks:
  - name: 전체시간제한
    description: 제한 시간을 넘긴 실행은 부분 통과가 아니라 실행 불가여야 한다
    page: /
    steps:
      - {action: wait_ms, value: "5000"}

report:
  title: 전체 실행 deadline 검출 데모
  video: false
  trace: false

output_dir: runs
