[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webtest-agent"
version = "0.1.0"
description = "Deterministic web application test runner with UI, API, and database oracles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

# Upper bounds are deliberate. A test runner that silently changes behaviour when a
# dependency ships a new major version cannot claim deterministic results; pinned
# builds go through constraints.txt.
dependencies = [
  "playwright>=1.45,<2",
  "flask>=3.0,<4",
  "pyyaml>=6.0,<7",
  "pillow>=10.0,<13",
]

[project.optional-dependencies]
db = ["sqlalchemy>=2.0,<3"]
dev = ["pytest>=8.0,<10"]

[project.scripts]
webtest-agent = "webtest_agent.cli:main"

[project.urls]
Homepage = "https://github.com/easyseop/test-agent"

[tool.setuptools.packages.find]
include = ["webtest_agent*"]

[tool.setuptools.package-data]
webtest_agent = ["vendor/*.js", "vendor/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
