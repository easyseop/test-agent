<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인 — 주문 관리 대시보드</title>
<style>
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;margin:0;background:#f5f6f8;color:#1f2937;
display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:28px 32px;width:320px}
h1{font-size:18px;margin:0 0 16px}
label{display:block;font-size:13.5px;margin:10px 0 4px}
input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px}
button{width:100%;margin-top:16px;padding:9px;border:none;border-radius:6px;background:#2563eb;color:#fff;
font-size:14px;cursor:pointer}
.error{color:#dc2626;font-size:13px;margin-top:10px}
.hint{color:#9ca3af;font-size:12px;margin-top:12px}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <h1>주문 관리 대시보드</h1>
  <label for="username">아이디</label>
  <input id="username" name="username" autocomplete="username">
  <label for="password">비밀번호</label>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <button id="login-btn" type="submit">로그인</button>
  {% if error %}<p id="login-error" class="error">{{ error }}</p>{% endif %}
  <p class="hint">데모 계정: demo / demo1234</p>
</form>
</body>
</html>
