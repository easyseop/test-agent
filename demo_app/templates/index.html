<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 관리 대시보드</title>
<style>
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;margin:0;background:#f5f6f8;color:#1f2937}
.wrap{max-width:980px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px}
form,.toolbar{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px 14px;margin:10px 0;
display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
label{display:flex;gap:6px;align-items:center}
input,select{padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:14px}
button,a.btn{padding:6px 14px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;
font-size:14px;text-decoration:none;color:#1f2937}
button#apply{background:#2563eb;color:#fff;border-color:#2563eb}
button#danger-delete{border-color:#dc2626;color:#dc2626}
table{border-collapse:collapse;width:100%;background:#fff;font-size:13.5px}
td,th{border:1px solid #e5e7eb;padding:6px 10px;text-align:left}
th{background:#f9fafb}
#summary{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
.count{font-size:14px;margin:8px 2px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>주문 관리 대시보드</h1>
  <nav>
    <a href="/about">소개</a>
    {% if auth_user %} · <span>{{ auth_user }}</span> <a id="logout-link" href="/logout">로그아웃</a>{% endif %}
  </nav>
</header>

<form id="filter-form" method="get" action="/">
  <label>상태
    <select id="status" name="status">
      <option value="">전체</option>
      {% for s in statuses %}
      <option value="{{ s }}" {% if args.get('status') == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <label>카테고리
    <select id="category" name="category">
      <option value="">전체</option>
      {% for c in categories %}
      <option value="{{ c }}" {% if args.get('category') == c %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
  </label>
  <label>고객 검색 <input id="q" name="q" value="{{ args.get('q', '') }}" placeholder="고객명"></label>
  <label>시작일 <input id="date-from" name="date_from" value="{{ args.get('date_from', '') }}" placeholder="YYYY-MM-DD" size="10"></label>
  <label>종료일 <input id="date-to" name="date_to" value="{{ args.get('date_to', '') }}" placeholder="YYYY-MM-DD" size="10"></label>
  <button id="apply" type="submit">조회</button>
  <a id="reset" class="btn" href="/">초기화</a>
</form>

<div class="toolbar">
  <button id="refresh" type="button" onclick="location.reload()">새로고침</button>
  <button id="summary-btn" type="button" onclick="{{ 'showSummry()' if bug else 'showSummary()' }}">요약 보기</button>
  <a id="export" class="btn" href="/export.csv?{{ request.query_string.decode() }}">CSV 내려받기</a>
  <button id="danger-delete" type="button"
    onclick="if (confirm('정말 전체 주문을 삭제하시겠습니까?')) alert('데모 앱에서는 실제로 삭제되지 않습니다.')">전체 삭제</button>
</div>

<p class="count">검색 결과 <span id="result-count">{{ count }}</span>건</p>
<div id="summary" style="display:none"></div>

<table id="orders-table">
  <thead>
    <tr><th>주문번호</th><th>고객</th><th>상태</th><th>카테고리</th><th>금액</th><th>주문일</th></tr>
  </thead>
  <tbody>
    {% for r in rows %}
    <tr>
      <td>{{ r[0] }}</td><td>{{ r[1] }}</td><td>{{ r[2] }}</td>
      <td>{{ r[3] }}</td><td>{{ "{:,}".format(r[4]) }}</td><td>{{ r[5] }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<script>
function showSummary() {
  const cells = document.querySelectorAll('#orders-table tbody td:nth-child(5)');
  let total = 0;
  cells.forEach(c => { total += parseInt(c.innerText.replace(/,/g, ''), 10) || 0; });
  const el = document.getElementById('summary');
  el.innerText = '표시된 주문 금액 합계: ' + total.toLocaleString() + '원';
  el.style.display = (el.style.display === 'none') ? 'block' : 'none';
}
</script>
</div>
</body>
</html>
