<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>결제 — 주문 관리 대시보드</title>
<style>body{font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;margin:0;background:#f5f6f8;color:#1f2937}
.wrap{max-width:720px;margin:0 auto;padding:24px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:16px 20px}
label{display:block;margin:8px 0}
input,button{font:inherit;padding:6px 10px}
button{cursor:pointer}
iframe{width:100%;height:230px;border:1px solid #d1d5db;border-radius:6px;background:#fff}</style>
</head>
<body>
<div class="wrap">
  <h1>결제</h1>
  <div class="card">
    <p>결제 금액 <b id="checkout-amount">{{ amount }}</b>원</p>

    <h2>카드 정보 (iframe)</h2>
    <iframe id="pg-frame" title="카드 입력" src="/pay-frame?amount={{ amount }}"></iframe>

    <h2>새 창으로 확인</h2>
    <button id="open-popup" type="button"
            onclick="window.open('/pay-popup?amount={{ amount }}', 'pay', 'width=420,height=320')">
      결제창 열기
    </button>

    <p><a id="back-home" href="/">← 대시보드로 돌아가기</a></p>
  </div>
</div>
</body>
</html>
